[project]
name = "LocalCloud"
version = "0.1.0"
description = "Веб-приложение для персонального хранения файлов"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.17.2",
    "asyncpg>=0.31.0",
    "bcrypt>=3.2.0,<4.0.0",
    "fastapi>=0.125.0",
    "minio>=7.2.20",
    "passlib[argon2,bcrypt]>=1.7.4",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "ruff",
    "ty",
]
