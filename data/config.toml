[app]
name    = "LocalCloud"
version = "1.0.0"
debug   = false

[server]
host    = "0.0.0.0"
port    = 8000
workers = 4

[database]
url       = "postgresql+asyncpg://user:pass@localhost:5432/localcloud"
pool_size = 10

[storage]
endpoint   = "localhost:9000"
access_key = "minioadmin"
secret_key = "minioadmin"
secure     = false

[storage.buckets]
files    = "localcloud-files"
temp     = "localcloud-temp"
archives = "localcloud-archives"

[auth]
access_token_expire_minutes = 30
refresh_token_expire_days   = 30
algorithm = "HS256"

[quota]
default_storage_gb = 20
max_file_size_mb   = 512
